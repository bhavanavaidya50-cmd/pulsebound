<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#070913" />
  <title>PULSEBOUND – The Hidden Path</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./src/styles/style.css" />
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>
    
    <!-- Virtual Mobile Touch Controls Overlay -->
    <div id="mobile-controls" class="hidden">
      <div class="touch-cluster touch-left">
        <button id="btn-left" class="touch-btn" aria-label="Move Left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button id="btn-right" class="touch-btn" aria-label="Move Right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <div class="touch-cluster touch-right">
        <button id="btn-pulse" class="touch-btn pulse-glow" aria-label="Activate Pulse">
          <div class="btn-pulse-wave"></div>
          <span>PULSE</span>
        </button>
        <button id="btn-jump" class="touch-btn jump-glow" aria-label="Jump">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
      </div>

      <!-- Quick mobile pause button -->
      <button id="btn-mobile-pause" class="touch-btn top-pause" aria-label="Pause Game">
        <span>⏸</span>
      </button>
    </div>

    <!-- Quick Touch Toggle for Desktop Testers -->
    <div id="dev-touch-toggle">
      <button id="btn-toggle-touch" title="Toggle On-Screen Touch Controls">📱 Touch UI: Auto</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
